name: LegalEase Automated CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Full Test Suite & Security Validation
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest with Real Redis Service
        env:
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-characters-long!
          ADMIN_BOOTSTRAP_SECRET: test-bootstrap-secret-1234567890
          ENVIRONMENT: development
        run: |
          python -m pytest tests/ -p no:langsmith -v
